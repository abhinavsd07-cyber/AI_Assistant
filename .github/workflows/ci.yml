name: Nebula AI Enterprise CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Production Bundle (TypeScript + Vite)
        run: npm run build

  backend-verification:
    name: Backend Syntax & ML Evaluation Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci

      - name: Verify Server & Middleware Syntax
        run: |
          node -c server.js
          node -c middleware/security.js
          node -c services/imageGen.js
          node -c services/memory.js
          node -c services/ollama.js
          node -c services/cloudinary.js

      - name: Run Automated NLP & ML Evaluation Suite
        run: npm test
